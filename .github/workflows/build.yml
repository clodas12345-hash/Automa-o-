- name: Run APK on emulator and capture crash log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.gkd.automacao -c android.intent.category.LAUNCHER 1
            sleep 5
            adb logcat -d | grep -A 30 "AndroidRuntime" > crash_log.txt || true
            cat crash_log.txt

      - name: Upload crash log
        uses: actions/upload-artifact@v4
        with:
          name: crash-log
          path: crash_log.txt
